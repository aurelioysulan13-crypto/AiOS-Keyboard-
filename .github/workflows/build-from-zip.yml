name: Build AyOS Keyboard APK

on:
  push:
    paths:
      - 'v3.1.45 AyOS Keyboard Code.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source ZIP
        shell: bash
        run: |
          ZIP_FILE="v3.1.45 AyOS Keyboard Code.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Required source ZIP not found: $ZIP_FILE"
            exit 1
          fi

          if ! unzip -t "$ZIP_FILE" >/dev/null; then
            echo "::error::The source ZIP is invalid or corrupted."
            exit 1
          fi

          echo "Source ZIP verified: $ZIP_FILE"

      - name: Extract Android project
        id: extract
        shell: bash
        run: |
          ZIP_FILE="v3.1.45 AyOS Keyboard Code.zip"
          EXTRACT_DIR="$RUNNER_TEMP/aios-keyboard-source"

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          PROJECT_SETTINGS="$(find "$EXTRACT_DIR" \
            -type f -name settings.gradle -print -quit)"

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "::error::Could not locate settings.gradle in the extracted ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "::error::Root build.gradle is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project located successfully."
          echo "Project directory: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Verify generated APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK generation failed. Output file not found."
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyOS-Keyboard-v3.1.45-APK
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
