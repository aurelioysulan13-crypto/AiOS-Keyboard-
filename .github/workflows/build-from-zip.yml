name: Build AyOS APK from Uploaded ZIP

on:
  push:
    paths:
      - 'AyOS-Keyboard-repo-root-v3.85.zip'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayos-zip-build
  cancel-in-progress: false

jobs:
  build:
    name: Extract and build v3.85
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out automation repository
        uses: actions/checkout@v4

      - name: Confirm source ZIP exists
        shell: bash
        run: |
          test -f AyOS-Keyboard-repo-root-v3.85.zip || {
            echo "::error::Upload the v3.85 ZIP first."
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Safely extract and validate source ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil
          import stat

          archive = Path("AyOS-Keyboard-repo-root-v3.85.zip")
          destination = Path("/tmp/ayos-source").resolve()
          destination.mkdir(parents=True, exist_ok=True)

          required = [
              "settings.gradle",
              "build.gradle",
              "gradle.properties",
              "app/build.gradle",
              "app/src/main/AndroidManifest.xml",
          ]

          with ZipFile(archive) as zf:
              if not zf.infolist():
                  raise SystemExit("The uploaded ZIP is empty.")

              for entry in zf.infolist():
                  name = entry.filename

                  if "\\" in name:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  rel = PurePosixPath(name)
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")
                  if rel.parts and ":" in rel.parts[0]:
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  mode = entry.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symbolic link not allowed: {name}")
                  if entry.is_dir():
                      continue

                  target = (
                      destination / Path(*rel.parts)
                  ).resolve()

                  if not target.is_relative_to(destination):
                      raise SystemExit(
                          f"ZIP entry escapes extraction folder: {name}"
                      )

                  target.parent.mkdir(
                      parents=True, exist_ok=True
                  )

                  with zf.open(entry) as src:
                      with target.open("wb") as dst:
                          shutil.copyfileobj(src, dst)

          missing = [
              p for p in required
              if not (destination / p).is_file()
          ]

          if missing:
              raise SystemExit(
                  "Missing Android project files: "
                  + ", ".join(missing)
              )

          print("Source extracted and validated.")

          PY

      - name: Build debug APK
        shell: bash
        run: |
          cd /tmp/ayos-source
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          test -s /tmp/ayos-source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyOS-Keyboard-v3.85-APK
          path: /tmp/ayos-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
