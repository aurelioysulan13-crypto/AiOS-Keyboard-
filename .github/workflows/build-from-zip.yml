
name: Build AyOS Keyboard APK

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detect most recently uploaded ZIP
        id: source
        shell: bash
        run: |
          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname '*.zip' -print | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No ZIP files were found in the repository root."
            exit 1
          fi

          LATEST_ZIP=""
          LATEST_TIMESTAMP=-1

          echo "ZIP files found:"
          printf ' - %s\n' "${ZIP_FILES[@]}"

          for ZIP_FILE in "${ZIP_FILES[@]}"; do
            TIMESTAMP="$(git log -1 --format='%ct' -- "$ZIP_FILE")"

            if [ -z "$TIMESTAMP" ]; then
              echo "::warning::Could not determine Git upload time for $ZIP_FILE"
              continue
            fi

            echo "Checking: $ZIP_FILE (Git timestamp: $TIMESTAMP)"

            if [ "$TIMESTAMP" -gt "$LATEST_TIMESTAMP" ]; then
              LATEST_TIMESTAMP="$TIMESTAMP"
              LATEST_ZIP="$ZIP_FILE"
            fi
          done

          if [ -z "$LATEST_ZIP" ]; then
            echo "::error::Could not determine the latest ZIP file."
            exit 1
          fi

          if ! unzip -t "$LATEST_ZIP" >/dev/null; then
            echo "::error::The newest ZIP is invalid or corrupted: $LATEST_ZIP"
            exit 1
          fi

          echo "zip_file=$LATEST_ZIP" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "SELECTED SOURCE ZIP: $LATEST_ZIP"
          echo "======================================"

      - name: Extract and validate Android project
        id: extract
        shell: bash
        env:
          ZIP_FILE: ${{ steps.source.outputs.zip_file }}
        run: |
          EXTRACT_DIR="$RUNNER_TEMP/aios-keyboard-source"

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          mapfile -t SETTINGS_FILES < <(
            find "$EXTRACT_DIR" \
              -type f \
              -name settings.gradle \
              -not -path '*/build/*'
          )

          if [ "${#SETTINGS_FILES[@]}" -eq 0 ]; then
            echo "::error::Could not locate settings.gradle in the selected ZIP."
            exit 1
          fi

          if [ "${#SETTINGS_FILES[@]}" -gt 1 ]; then
            echo "::error::Multiple Android project roots were found in the ZIP."
            printf '%s\n' "${SETTINGS_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"

          for REQUIRED_FILE in \
            "$PROJECT_DIR/build.gradle" \
            "$PROJECT_DIR/app/build.gradle" \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml" \
            "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"; do

            if [ ! -f "$REQUIRED_FILE" ]; then
              echo "::error::Required project file is missing: $REQUIRED_FILE"
              exit 1
            fi
          done

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Selected ZIP: $ZIP_FILE"
          echo "Android project validated."
          echo "Project directory: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Verify generated APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK generation failed. APK file is missing or empty."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyOS-Keyboard-APK
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
